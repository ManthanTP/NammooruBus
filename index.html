<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nb-theme') || 'system';
          var resolved = saved;
          if (saved === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          if (resolved !== 'dark' && resolved !== 'blue' && resolved !== 'light') {
            resolved = 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch(e) {}
      })();
    </script>
